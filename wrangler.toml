name = "emby-proxy" # Worker 的项目名称
main = "worker.js" # Worker 的主入口文件
compatibility_date = "2026-03-13" # 兼容性日期，用于指定使用的 Cloudflare 运行时版本
compatibility_flags = ["enable_request_signal"] # 开启 Request.signal 客户端断开感知
workers_dev = false   # ← 关闭默认 workers.dev 域名
keep_vars = true

[build]
command = "npm run build:worker"
watch_dir = ["worker", "vite.worker.config.js", "scripts/build-worker.mjs", "scripts/worker-build-lib.mjs"]

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[placement]
mode = "region"
region = "aws:ap-east-1"  # AWS 香港区域

# KV 命名空间绑定声明 (KV Namespace Binding)
[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "ENI_KV" # 代码中调用该 KV 的变量名
id = "b3687c90a04d468d9eb7c00dc8544aa6" # 你的 KV 命名空间 ID (请替换为实际的 32 位字母数字组合)

# D1 数据库绑定声明 (D1 Database Binding)
[[d1_databases]]
binding = "DB" # 代码中调用该数据库的变量名
database_name = "31fb51dc-bf05-4b8a-a906-8420294c2aea" # 你的 D1 数据库的名称
database_id = "31fb51dc-bf05-4b8a-a906-8420294c2aea" # 你的 D1 数据库 ID (请替换为实际的 UUID 格式)
